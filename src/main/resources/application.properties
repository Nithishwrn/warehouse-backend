spring.application.name=warehouse-management-system

# ---------------------------------------------------------------------------
# DATABASE
# 12-factor style: driven entirely by env vars, with local H2 defaults so
# `mvn spring-boot:run` still works with zero setup on a laptop.
#
# In production (Render/Railway/Fly/etc.), set these env vars to point at a
# managed PostgreSQL instance -- no code or file changes needed:
#   SPRING_DATASOURCE_URL=jdbc:postgresql://<host>:5432/<db>
#   SPRING_DATASOURCE_DRIVER=org.postgresql.Driver
#   SPRING_DATASOURCE_USERNAME=<user>
#   SPRING_DATASOURCE_PASSWORD=<password>
# ---------------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/warehousedb;AUTO_SERVER=TRUE}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---------------------------------------------------------------------------
# JWT
# In production, set app.jwt.secret via an environment variable
# (e.g. JWT_SECRET) rather than committing a real secret to source control.
# ---------------------------------------------------------------------------
app.jwt.secret=${JWT_SECRET:this-is-a-dev-only-secret-key-change-it-before-deploying-anywhere-real}
app.jwt.expiration-ms=86400000

# Render (and most PaaS hosts) inject PORT; fall back to 8080 locally.
server.port=${PORT:8080}
